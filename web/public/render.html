<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#fbf8f2}model-viewer{width:900px;height:900px}</style>
<script src="/mv.js"></script></head>
<body>
<model-viewer id="mv" camera-orbit="0deg 85deg auto" exposure="1.05"
  interaction-prompt="none" disable-zoom shadow-intensity="0"></model-viewer>

  document.getElementById('mv').src = '/models/' + (p.get('m')||'paper-bust.glb');
</script>
</body></html>
